# Executor service + hermes dependency. Merged in when COMPOSE_FILE includes
# this file (enable_executor: true). Omitted for hermes-only deploys.
services:
  executor:
    image: ${EXECUTOR_IMAGE:?set EXECUTOR_IMAGE in .env}
    restart: unless-stopped
    user: "${EXECUTOR_UID:?set EXECUTOR_UID in .env}:${EXECUTOR_GID:?set EXECUTOR_GID in .env}"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      EXECUTOR_WEB_BASE_URL: ${EXECUTOR_WEB_BASE_URL}
      EXECUTOR_BOOTSTRAP_ADMIN_EMAIL: ${EXECUTOR_BOOTSTRAP_ADMIN_EMAIL}
      EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD: ${EXECUTOR_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ${DATA_DIR}/executor-data:/data
    ports:
      - "127.0.0.1:${EXECUTOR_PORT:?set EXECUTOR_PORT in .env}:4788"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT??4788)+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  hermes:
    depends_on:
      executor:
        condition: service_healthy
