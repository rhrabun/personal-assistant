services:
  hermes:
    image: nousresearch/hermes-agent:latest
    command: gateway run
    restart: unless-stopped
    env_file: .env
    environment:
      HERMES_UID: ${EXECUTOR_UID:?set EXECUTOR_UID in .env}
      HERMES_GID: ${EXECUTOR_GID:?set EXECUTOR_GID in .env}
    volumes:
      - ${DATA_DIR}/hermes-data:/opt/data
      - ${CODE_DIR}:/opt/data/code
    mem_limit: 2500m
