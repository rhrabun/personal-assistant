---

- name: Provision VPS for personal assistant
  hosts: all
  gather_facts: true
  become: true
  vars:
    deploy_user: "{{ deploy_user }}"
    git_repo: "{{ git_repo | default('https://github.com/rhrabun/personal-assistant.git') }}"
    stack_dir: /opt/stack
    loopback_ip: 127.0.0.1

  pre_tasks:
    - name: Require deployment ssh key
      ansible.builtin.assert:
        that:
          - deploy_ssh_key is defined and deploy_ssh_key | length > 0
        fail_msg: >-
          missing var. Pass deploy_ssh_key via -e, e.g.
          -e deploy_ssh_key='ssh-ed25519 AAAA...'

    - name: Install shell tools
      ansible.builtin.apt:
        name:
          - zellij
          - zoxide
          - vim
        state: present
        update_cache: true

  tasks:
    # Configure server
    - name: Create deploy user and grant sudo
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Install deploy user ssh pubkey
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_ssh_key }}"
        state: present

    - name: SSH hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
      notify: restart ssh

    - name: ufw default deny incoming
      community.general.ufw:
        rule: default
        direction: incoming
        policy: deny
        state: enabled

    - name: ufw default allow outgoing
      community.general.ufw:
        rule: default
        direction: outgoing
        policy: allow
        state: enabled

    - name: ufw allow OpenSSH
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable automatic security upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    # Configure docker
    - name: Install docker dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add docker gpg key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add docker apt repo (Debian 13 = trixie)
      ansible.builtin.deb822_repository:
        name: docker-ce
        types: [deb]
        uris: https://download.docker.com/linux/debian
        suites: [trixie]
        components: [stable]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install docker-ce + compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Capture /etc/docker dir state
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Docker log rotation daemon.json
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          { "log-driver": "json-file", "log-opts": { "max-size": "10m", "max-file": "3" } }
      notify: restart docker

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Start docker service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    # Deploy personal-assistant stack
    - name: Clone personal-assistant into stack dir
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ stack_dir }}"
        version: main
        force: true

    - name: Resolve loopback placeholder for executor port
      ansible.builtin.replace:
        path: "{{ stack_dir }}/docker-compose.yml"
        regexp: '\[IP_ADDRESS\]'
        replace: "{{ loopback_ip }}"

    - name: Template .env from vars (chmod 600)
      ansible.builtin.template:
        src: env.j2
        dest: "{{ stack_dir }}/.env"
        mode: "0600"

    - name: Bring up the stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ stack_dir }}"
      register: compose
      changed_when: "'Started' in compose.stdout or 'Created' in compose.stdout or compose.rc != 0"
      failed_when: compose.rc != 0

    - name: Show pull/start output
      ansible.builtin.debug:
        var: compose.stdout_lines

    - name: Deploy summary
      ansible.builtin.debug:
        msg:
          - "Stack deployed to {{ stack_dir }}."
          - "Containers:"
          - "  docker ps"
          - "Post-deploy: configure the LLM provider + Telegram channel"
          - "  docker exec -it hermes hermes setup"
          - "Executor UI via tunnel (loopback only):"
          - "  ssh -L 4788:{{ loopback_ip }}:4788 {{ inventory_hostname }}"

  handlers:
    - name: restart ssh
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    - name: restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
