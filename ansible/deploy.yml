---

- name: Deploy personal-assistant stack
  hosts: all
  gather_facts: true
  vars:
    git_repo: https://github.com/rhrabun/personal-assistant.git
    base_dir: "/home/{{ deploy_user }}/hermes-agent"
    stack_dir: "{{ base_dir }}/stack"
    data_dir: "{{ base_dir }}/data"
    loopback_ip: 127.0.0.1

  pre_tasks:
    - name: Require docker installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Fail if docker missing
      ansible.builtin.fail:
        msg: "docker not installed."
      when: not docker_bin.stat.exists

  tasks:
    - name: Resolve deploy user uid/gid
      ansible.builtin.getent:
        database: passwd
        key: "{{ deploy_user }}"
    - name: Set user uid/gid vars
      ansible.builtin.set_fact:
        user_uid: "{{ ansible_facts.getent_passwd[deploy_user][1] }}"
        user_gid: "{{ ansible_facts.getent_passwd[deploy_user][2] }}"

    - name: Create hermes-agent base dir
      ansible.builtin.file:
        path: "{{ base_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Create data dirs
      ansible.builtin.file:
        path: "{{ data_dir }}/{{ item }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"
      loop:
        - ""
        - hermes-data
        - executor-data

    # Deploy personal-assistant stack
    - name: Clone personal-assistant into stack dir
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ stack_dir }}"
        version: main
        force: true

    - name: Resolve loopback placeholder for executor port
      ansible.builtin.replace:
        path: "{{ stack_dir }}/docker-compose.yml"
        regexp: '\[IP_ADDRESS\]'
        replace: "{{ loopback_ip }}"

    - name: Template .env from vars (chmod 600)
      ansible.builtin.template:
        src: env.j2
        dest: "{{ stack_dir }}/.env"
        mode: "0600"

    - name: Bring up the stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ stack_dir }}"
      register: compose
      changed_when: "'Started' in compose.stdout or 'Created' in compose.stdout or compose.rc != 0"
      failed_when: compose.rc != 0

    - name: Show pull/start output
      ansible.builtin.debug:
        var: compose.stdout_lines

    - name: Deploy summary
      ansible.builtin.debug:
        msg:
          - "Stack deployed to {{ stack_dir }}."
          - "Containers:"
          - "  docker ps"
          - "Post-deploy: configure hermes:"
          - "  docker exec -it hermes hermes setup"
          - "Executor UI via tunnel (loopback only):"
          - "  ssh -L 4788:{{ loopback_ip }}:4788 {{ inventory_hostname }}"
