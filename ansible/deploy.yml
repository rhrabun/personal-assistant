---

- name: Deploy personal-assistant stack
  hosts: all
  gather_facts: true
  become: true
  vars:
    git_repo: "{{ git_repo | default('https://github.com/rhrabun/personal-assistant.git') }}"
    stack_dir: /opt/stack
    loopback_ip: [IP_ADDRESS]

  pre_tasks:
    - name: Require docker installed
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Fail if docker missing
      ansible.builtin.fail:
        msg: "docker not installed. Run provision-os-playbook (server profile) first."
      when: not docker_bin.stat.exists

  tasks:
    # Deploy personal-assistant stack
    - name: Clone personal-assistant into stack dir
      ansible.builtin.git:
        repo: "{{ git_repo }}"
        dest: "{{ stack_dir }}"
        version: main
        force: true

    - name: Resolve loopback placeholder for executor port
      ansible.builtin.replace:
        path: "{{ stack_dir }}/docker-compose.yml"
        regexp: '\[IP_ADDRESS\]'
        replace: "{{ loopback_ip }}"

    - name: Template .env from vars (chmod 600)
      ansible.builtin.template:
        src: env.j2
        dest: "{{ stack_dir }}/.env"
        mode: "0600"

    - name: Bring up the stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ stack_dir }}"
      register: compose
      changed_when: "'Started' in compose.stdout or 'Created' in compose.stdout or compose.rc != 0"
      failed_when: compose.rc != 0

    - name: Show pull/start output
      ansible.builtin.debug:
        var: compose.stdout_lines

    - name: Deploy summary
      ansible.builtin.debug:
        msg:
          - "Stack deployed to {{ stack_dir }}."
          - "Containers:"
          - "  docker ps"
          - "Post-deploy: configure the LLM provider + Telegram channel"
          - "  docker exec -it hermes hermes setup"
          - "Executor UI via tunnel (loopback only):"
          - "  ssh -L 4788:{{ loopback_ip }}:4788 {{ inventory_hostname }}"
